kind = "web"
previewPath = "/"
title = "Restora"
description = "A Ghana-focused waste cleanup and rewards platform that helps people report litter, verify community cleanups, explore neighborhood impact, and earn recognition for restoring shared spaces."
version = "1.0.0"
id = "artifacts/restora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23797

[services.development]
run = "pnpm --filter @workspace/restora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/restora", "run", "build" ]
serve = "static"
publicDir = "artifacts/restora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23797"
BASE_PATH = "/"
